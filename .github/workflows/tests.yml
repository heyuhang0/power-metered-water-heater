name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    name: Model + contract (HA 2026.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'homeassistant==2026.11.2' -r requirements_test.txt
      - name: Run
        run: python -m pytest -q --ignore=tests/test_integration.py

  integration:
    name: End to end (HA 2026.10 test harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest-homeassistant-custom-component==0.13.375'
      - name: Run
        run: python -m pytest -q tests/test_integration.py
