[project]
name = "power-metered-water-heater"
version = "0.1.4"
description = "Home Assistant helper: a storage water heater on a power-metering switch or smart plug, with tank state and hot water use worked out from its power"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p tests.ha_preload"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
